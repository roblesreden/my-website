<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reden Jhon Robles</title>
    <meta
      name="description"
      content="Portfolio of Reden Jhon Robles, a BSIT student."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="#about">Reden Jhon Robles</a>
      <nav aria-label="Main">
        <a href="#about">About me</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <main>
      <!-- ABOUT ME -->
      <section id="about" class="intro">
        <div class="intro-text">
          <h1>About me</h1>
          <p class="lead">
            Hi, I'm Reden Jhon, a BSIT student who wants to learn more about
            web development and pursue my career as a programmer.
          </p>
        </div>
        <img
          class="portrait"
          src="me.jfif"
          alt="Portrait of Reden Jhon Robles"
          width="480"
          height="600"
        />
      </section>

      <!-- PROJECTS -->
      <section id="projects" class="section">
        <h2>Projects</h2>
        <figure class="video-wrap">
          <video controls preload="metadata" playsinline>
            <source src="video.mp4" type="video/mp4" />
          </video>
        </figure>
      </section>

      <!-- CONTACT -->
      <section id="contact" class="section contact">
        <h2>Contact</h2>
        <p>contact me here</p>
        <ul class="contact-links">
          <li>
            <a
              class="contact-btn"
              href="https://mail.google.com/mail/?view=cm&to=roblesredenjhon@gmail.com"
              target="_blank"
              rel="noopener"
            >
              <span class="icon" aria-hidden="true">✉</span> Gmail
            </a>
          </li>
          <li>
            <a
              class="contact-btn"
              href="https://www.facebook.com/Reden Robles"
              target="_blank"
              rel="noopener"
            >
              <span class="icon" aria-hidden="true">f</span> Facebook
            </a>
          </li>
        </ul>
      </section>
    </main>

    <footer class="site-footer">
      <p>
        <a
          href="https://www.facebook.com/Reden Robles"
          target="_blank"
          rel="noopener"
          >Facebook</a
        >
        <a
          href="https://mail.google.com/mail/?view=cm&to=roblesredenjhon@gmail.com"
          target="_blank"
          rel="noopener"
          >Gmail</a
        >
      </p>
    </footer>
  </body>
</html>
